server:
  port: 8099

spring:
  application:
    name: chatbot
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  ai:
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST}
          port: ${MILVUS_PORT}
        databaseName: ${MILVUS_DATABASE}
        collectionName: "user_memory"
        embeddingDimension: 1024
        indexType: IVF_FLAT
        metricType: COSINE

    # RAG 知识库向量存储配置（自定义属性，由 RagVectorStoreConfig 读取）
    rag:
      vectorstore:
        milvus:
          collectionName: "rag_knowledge"
          embeddingDimension: 1024

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash

    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: mysql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
  group-configs:
    - group: default
      paths-to-match: /**
knife4j:
  enable: true

chatbot:
  plugins:
    enabled: true
    items:
      time: { enabled: false }
      calculator: { enabled: false }
      web-search:
        enabled: false
        config:
          api-key: ${QIANFAN_API_KEY}
          top-k: 5
  skills:
    directory: classpath:skills
    auto-reload: true